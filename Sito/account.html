<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Il tuo account – Estè Centro Estetico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.hidden{display:none!important}
.acc{max-width:560px;margin:0 auto}
.acc-card{background:#fff;border:1px solid var(--rosa-chiaro);border-radius:var(--r);padding:38px;box-shadow:var(--ombra)}
.acc-card .tabs{margin-bottom:28px}
.err{color:#d6196e;font-size:.85rem;min-height:22px;margin-bottom:8px}
.alt{text-align:center;font-size:.85rem;margin-top:22px;color:#9a6b86}
.alt a{color:var(--fucsia);font-weight:600}
.me{display:grid;grid-template-columns:1fr 2fr;gap:30px;align-items:start}
.profile{background:var(--grad);color:#fff;border-radius:var(--r);padding:34px 28px;box-shadow:var(--ombra);text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--fucsia);font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.profile h3{color:#fff;font-size:1.5rem}
.profile p{font-size:.88rem;opacity:.9;word-break:break-all}
.profile .btn{background:#fff;color:var(--fucsia)!important;margin-top:16px;width:100%;box-shadow:none}
.profile .out{background:transparent;border:2px solid rgba(255,255,255,.7);color:#fff!important}
.mybk{background:#fff;border:1px solid var(--rosa-chiaro);border-radius:var(--r);padding:30px;box-shadow:0 10px 40px rgba(214,25,110,.08)}
.bk{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 18px;border:1px solid var(--rosa-chiaro);border-radius:18px;background:var(--cipria);margin-bottom:12px;flex-wrap:wrap}
.bk b{font-family:'Playfair Display',serif;color:var(--prugna);font-size:1.1rem}
.bk small{display:block;color:#7b5a6d}
.pill{display:inline-block;padding:3px 12px;border-radius:50px;font-size:.75rem;font-weight:600;margin-left:8px}
.pill.attesa{background:#fff0c9;color:#9a6b00}.pill.confermata{background:#d7f5e5;color:#157a47}.pill.annullata{background:#ffe0e8;color:#b0123f}
.mini{padding:8px 16px;border-radius:50px;border:2px solid var(--rosa-chiaro);background:#fff;font-family:inherit;font-weight:600;font-size:.8rem;cursor:pointer;color:#b0123f}
.mini:hover{border-color:var(--fucsia)}
.empty{text-align:center;padding:40px 10px;color:#9a6b86}
@media(max-width:800px){.me{grid-template-columns:1fr}.acc-card{padding:26px 20px}}
</style>
</head>
<body>

<div class="page-head">
  <div class="container">
    <span class="tag" style="background:#fff">Area clienti</span>
    <h1>Il tuo <em>account</em></h1>
    <p>Accedi per prenotare più velocemente e seguire i tuoi appuntamenti.</p>
  </div>
</div>

<section>
  <div class="container">

    <!-- ACCESSO / REGISTRAZIONE CLIENTI -->
    <div class="acc" id="guest">
      <div class="acc-card">
        <div class="tabs">
          <button class="tab on" data-f="fLogin" type="button">Accedi</button>
          <button class="tab" data-f="fReg" type="button">Registrati</button>
        </div>

        <form id="fLogin">
          <div class="field"><label>Email o nome utente</label><input id="le" autocomplete="username" required></div>
          <div class="field"><label>Password</label><input type="password" id="lp" autocomplete="current-password" required></div>
          <div class="err" id="lerr"></div>
          <button class="btn" style="width:100%">Accedi</button>
        </form>

        <form id="fReg" class="hidden">
          <div class="field"><label>Nome e cognome</label><input id="rn" autocomplete="name" required></div>
          <div class="row">
            <div class="field"><label>Telefono</label><input type="tel" id="rt" autocomplete="tel" required></div>
            <div class="field"><label>Email</label><input type="email" id="re" autocomplete="email" required></div>
          </div>
          <div class="field"><label>Password (min. 6 caratteri)</label><input type="password" id="rp" minlength="6" autocomplete="new-password" required></div>
          <div class="err" id="rerr"></div>
          <button class="btn" style="width:100%">Crea account</button>
        </form>

        <p class="alt">Puoi prenotare anche senza account · <a href="prenotazioni.html">Vai alle prenotazioni</a></p>
      </div>
    </div>

    <!-- AREA PERSONALE -->
    <div class="me hidden" id="me">
      <div class="profile">
        <div class="avatar" id="av"></div>
        <h3 id="mn"></h3>
        <p id="mm"></p><p id="mt"></p>
        <a href="prenotazioni.html" class="btn">Nuova prenotazione</a>
        <button class="btn out" id="out" type="button">Esci</button>
      </div>
      <div class="mybk">
        <h3 style="margin-bottom:18px">Le mie prenotazioni</h3>
        <div id="list"></div>
      </div>
    </div>

  </div>
</section>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
<script>
const $=id=>document.getElementById(id);

async function view(){
  const me=await DB.me();
  if(me&&me.role==='admin'){location.replace('admin.html');return}
  $('guest').classList.toggle('hidden',!!me);
  $('me').classList.toggle('hidden',!me);
  if(!me)return;
  $('av').textContent=me.name.trim()[0].toUpperCase();
  $('mn').textContent=me.name;$('mm').textContent=me.email;$('mt').textContent=me.tel||'';
  const l=(await DB.listBookings()).sort((a,b)=>(b.data+b.ora).localeCompare(a.data+a.ora));
  if(!l.length){$('list').innerHTML='<div class="empty">🌸 Non hai ancora prenotazioni.</div>';return}
  $('list').innerHTML=l.map(b=>{
    const k=b.stato==='in attesa'?'attesa':b.stato;
    const can=b.stato!=='annullata'&&b.data>=DB.today();
    return `<div class="bk"><div><b>${DB.fmtDate(b.data)} · ${b.ora}</b><span class="pill ${k}">${b.stato}</span>
      <small>${DB.esc((b.servizi||[]).join(', '))} · € ${b.prezzo}</small></div>
      ${can?`<button class="mini" data-id="${b.id}">Annulla</button>`:''}</div>`}).join('');
  $('list').querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Vuoi annullare questa prenotazione?'))return;
    const r=await DB.setBookingStatus(b.dataset.id,'annullata');
    if(r.error)alert('Non è stato possibile annullare: '+r.error);
    view();
  });
}

document.querySelectorAll('.acc-card .tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.acc-card .tab').forEach(x=>x.classList.toggle('on',x===t));
  ['fLogin','fReg'].forEach(f=>$(f).classList.toggle('hidden',f!==t.dataset.f));
});

const next=()=>new URLSearchParams(location.search).get('next')==='prenota'?'prenotazioni.html':'account.html';

$('fLogin').onsubmit=async e=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');btn.disabled=true;
  const r=await DB.signIn($('le').value,$('lp').value);
  btn.disabled=false;
  if(r.error){$('lerr').textContent=r.error;$('lp').value='';return}
  location.href=r.role==='admin'?'admin.html':next();
};
$('fReg').onsubmit=async e=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');btn.disabled=true;
  const r=await DB.signUp({nome:$('rn').value,tel:$('rt').value,email:$('re').value,password:$('rp').value});
  btn.disabled=false;
  if(r.error){$('rerr').textContent=r.error;return}
  if(r.needsConfirm){$('rerr').style.color='#157a47';$('rerr').textContent='Account creato! Controlla la tua email e conferma l\'indirizzo, poi accedi.';return}
  location.href=next();
};
$('out').onclick=async()=>{await DB.signOut();location.reload()};
view();
</script>
</body>
</html>
